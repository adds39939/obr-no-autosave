[NoAutosave]
; 1 (default): disable every autosave the engine can trigger (area/door
;    transitions, fast travel, rest, wait, level-up, scripted autosaves).
;    Manual saves and quicksaves are unaffected.
; 0: only remove the area-transition autosave that ignores the in-game
;    settings. The in-game "Save on fast travel / rest / wait" toggles keep
;    working for everything else.
bDisableAllAutosaves=1

; 1: write NoAutosave.log next to the DLL on every launch (useful to confirm
;    the patch applied, or to report a problem after a game update).
; 0 (default): write no log file.
bEnableLog=0
